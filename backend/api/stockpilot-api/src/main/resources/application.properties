spring.application.name=stockpilot-api

spring.datasource.url=${STOCKPILOT_DB_URL}
spring.datasource.username=${STOCKPILOT_DB_USER}
spring.datasource.password=${STOCKPILOT_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/

# 로컬 HTTP는 false, HTTPS 배포 시 SESSION_COOKIE_SECURE=true 설정
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
